<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LO TENGO - Ultra Pro</title>
    <style>
        :root {
            --primary: #0F172A;
            --accent: #FF5722;
            --accent-gradient: linear-gradient(135deg, #FF5722, #FF9800);
            --outlet-gradient: linear-gradient(135deg, #D946EF, #8B5CF6);
            --success: #10B981;
            --bg-body: #0B0F19;
            --card-bg: #1E293B;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-glow: 0 10px 30px -10px rgba(255, 87, 34, 0.3);
            --shadow-outlet: 0 12px 35px -8px rgba(217, 70, 239, 0.4);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        #app-container {
            background: #111827;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
        }

        .header-app {
            background: linear-gradient(180deg, #1E293B, #111827);
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .header-app h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .content-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 110px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 15px 18px;
            margin: 0 0 16px 0;
            border: 1.5px solid var(--card-border);
            border-radius: var(--radius-md);
            box-sizing: border-box;
            font-size: 15px;
            background: #1F2937;
            color: white;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 800;
            cursor: pointer;
            font-size: 15px;
            box-shadow: var(--shadow-glow);
            transition: all 0.2s;
        }
        button:hover { opacity: 0.95; transform: translateY(-2px); }
        button:active { transform: scale(0.98); }

        .link-btn {
            background: none;
            color: var(--accent);
            border: none;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
            box-shadow: none;
        }

        /* Buscador Ultra Pro */
        .search-container {
            background: #1F2937;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            border: 1.5px solid var(--card-border);
        }
        .search-container input {
            border: none;
            background: transparent;
            margin: 0;
            padding: 0;
            outline: none;
            font-size: 15px;
            color: white;
        }

        /* Carrusel Categorías Estilizadas */
        .categorias-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 28px;
            scrollbar-width: none;
        }
        .categorias-scroll::-webkit-scrollbar { display: none; }

        .cat-card {
            min-width: 90px;
            max-width: 90px;
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }
        .cat-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }
        
        /* Banner Zona Outlet ultra llamativo */
        .outlet-super-banner {
            background: var(--outlet-gradient);
            color: white;
            padding: 24px;
            border-radius: var(--radius-lg);
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-outlet);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            animation: pulse-outlet 3s infinite;
        }
        @keyframes pulse-outlet {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); box-shadow: 0 15px 40px -5px rgba(217, 70, 239, 0.6); }
            100% { transform: scale(1); }
        }

        .section-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--text-main);
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: -0.3px;
        }

        /* Tarjetas de Comercios Pro */
        .comercio-card {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .comercio-card:hover {
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .comercio-avatar {
            width: 72px;
            height: 72px;
            border-radius: var(--radius-md);
            object-fit: cover;
            background: #374151;
            flex-shrink: 0;
        }

        .badge-estado {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            display: inline-block;
        }
        .estado-recibido { background: #374151; color: #E5E7EB; }
        .estado-proceso { background: #78350F; color: #FCD34D; }
        .estado-pronto { background: #064E3B; color: #6EE7B7; }
        .estado-camino { background: #1E3A8A; color: #93C5FD; }

        /* Barra de Navegación Inferior Estilo App Moderna */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 14px 0;
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-weight: 600;
            transition: color 0.2s;
        }
        .nav-item span { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent); font-weight: 800; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="header-app">
            <h1><span style="color: var(--accent);">LO</span> TENGO <small style="font-size:10px; opacity:0.7; font-weight: 400;">ULTRA V2</small></h1>
            <span id="header-user-info" style="font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--card-border);">📍 Montevideo</span>
        </div>
        
        <div class="content-body" id="main-content">
            <div id="screen-login">
                <h3 style="color: var(--text-main); margin-top: 0; font-size: 22px; font-weight: 900;">Iniciar Sesión</h3>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">Accede a tu cuenta de LO TENGO.</p>
                
                <label>Número de WhatsApp:</label>
                <input type="tel" id="loginTelefono" placeholder="Ej: 099123456">

                <label>Contraseña:</label>
                <input type="password" id="loginPassword" placeholder="Tu contraseña">

                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px; background: #1F2937; padding: 14px; border-radius: var(--radius-md); border: 1.5px solid var(--card-border);">
                    <input type="checkbox" id="recordarCredenciales" style="width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: var(--accent);">
                    <label for="recordarCredenciales" style="font-size: 13px; color: var(--text-main); cursor: pointer; margin: 0; font-weight: 700;">Recordar credenciales</label>
                </div>

                <button id="btnIniciarSesion" type="button">Ingresar al Sistema</button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <button id="irARegistro" type="button" class="link-btn">¿No tenés cuenta? Registrate acá</button>
                </div>
            </div>

            <div id="screen-registro" style="display: none;">
                <h3 style="color: var(--text-main); margin-top: 0; font-size: 22px; font-weight: 900;">Crear Cuenta</h3>
                <label>Nombre y Apellido:</label>
                <input type="text" id="regNombre" placeholder="Tu nombre">
                <label>WhatsApp:</label>
                <input type="tel" id="regTelefono" placeholder="Ej: 099123456">
                <label>Dirección en Montevideo:</label>
                <input type="text" id="regDireccion" placeholder="Calle, número y barrio">
                <label>Contraseña:</label>
                <input type="password" id="regPassword" placeholder="Contraseña segura">
                <button type="button" onclick="completarRegistroCliente()" style="background: var(--success); margin-top: 10px;">Completar Registro</button>
                <button type="button" onclick="irLogin()" class="link-btn" style="width:100%; text-align:center;">← Volver al login</button>
            </div>
        </div>

        <div class="bottom-nav" id="bottom-nav" style="display: none;">
            <button class="nav-item active" onclick="mostrarHome()"><span>🏠</span>Inicio</button>
            <button class="nav-item" onclick="mostrarZonaOutlet()"><span>⚡</span>Outlet</button>
            <button class="nav-item" onclick="mostrarFormularioCadeteria()"><span>🛵</span>Cadetería</button>
            <button class="nav-item" onclick="mostrarPedidosActivos()"><span>📦</span>Pedidos</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            verificarSesionCliente();
            configurarEventosLogin();
            cargarCredencialesGuardadas();

            window.addEventListener('storage', () => {
                const contenedorPedidos = document.getElementById('contenedor-cards-pedidos');
                if (contenedorPedidos) renderizarListaPedidos();
            });
        });

        function verificarSesionCliente() {
            const sesion = localStorage.getItem('lt_sesion_activa');
            if (sesion) {
                try {
                    const usuario = JSON.parse(sesion);
                    document.getElementById('header-user-info').innerText = `📍 ${usuario.direccion || 'Montevideo'}`;
                    document.getElementById('bottom-nav').style.display = 'flex';
                    mostrarHome();
                } catch (e) { console.error(e); }
            }
        }

        function cargarCredencialesGuardadas() {
            const guardado = localStorage.getItem('lt_credenciales_guardadas');
            if (guardado) {
                try {
                    const creds = JSON.parse(guardado);
                    document.getElementById('loginTelefono').value = creds.telefono || '';
                    document.getElementById('loginPassword').value = creds.password || '';
                    document.getElementById('recordarCredenciales').checked = true;
                } catch (e) { console.error(e); }
            }
        }

        function configurarEventosLogin() {
            const btnReg = document.getElementById('irARegistro');
            if (btnReg) {
                btnReg.onclick = () => {
                    document.getElementById('screen-login').style.display = 'none';
                    document.getElementById('screen-registro').style.display = 'block';
                };
            }

            const btnIng = document.getElementById('btnIniciarSesion');
            if (btnIng) {
                btnIng.onclick = () => {
                    const tel = document.getElementById('loginTelefono').value;
                    const pass = document.getElementById('loginPassword').value;
                    const recordar = document.getElementById('recordarCredenciales').checked;

                    const usuarios = JSON.parse(localStorage.getItem('lt_base_usuarios')) || [];
                    const usr = usuarios.find(u => u.telefono === tel && u.password === pass);

                    if (!usr) { alert("❌ Credenciales incorrectas."); return; }

                    if (recordar) {
                        localStorage.setItem('lt_credenciales_guardadas', JSON.stringify({ telefono: tel, password: pass }));
                    } else {
                        localStorage.removeItem('lt_credenciales_guardadas');
                    }

                    localStorage.setItem('lt_sesion_activa', JSON.stringify(usr));
                    location.reload();
                };
            }
        }

        function completarRegistroCliente() {
            let nombre = document.getElementById('regNombre').value;
            let telefono = document.getElementById('regTelefono').value;
            let direccion = document.getElementById('regDireccion').value;
            let password = document.getElementById('regPassword').value;

            if (!nombre || !telefono || !password) { alert("⚠️ Completá los campos obligatorios."); return; }

            let usuarios = JSON.parse(localStorage.getItem('lt_base_usuarios')) || [];
            let nuevoU = { nombre, telefono, direccion: direccion || 'Montevideo', password };
            usuarios.push(nuevoU);
            localStorage.setItem('lt_base_usuarios', JSON.stringify(usuarios));
            localStorage.setItem('lt_sesion_activa', JSON.stringify(nuevoU));
            alert("✅ ¡Registro exitoso!");
            location.reload();
        }

        function irLogin() {
            document.getElementById('screen-registro').style.display = 'none';
            document.getElementById('screen-login').style.display = 'block';
        }

        function esZonaSeguraEfectivo(direccion) {
            if (!direccion) return false;
            const dirLower = direccion.toLowerCase();
            const zonasSeguras = ['pocitos', 'punta carretas', 'carrasco', 'buceo', 'malvín', 'tres cruces', 'parque batlle', 'punta gorda', 'centro'];
            return zonasSeguras.some(z => dirLower.includes(z));
        }

        function mostrarHome() {
            actualizarMenuActivo(0);
            const container = document.getElementById('main-content');
            let baseEmpresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];

            let htmlComercios = baseEmpresas.map(emp => {
                let imagenComercio = (emp.giro === 'Gastronomía' && emp.logo) ? emp.logo : 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=200&q=80';
                let etiquetaGiro = emp.giro === 'Gastronomía' ? '🍔 Restaurantes' : '🛍️ Tiendas';

                return `
                    <div class="comercio-card" onclick="verCatalogoComercio('${emp.rut}')">
                        <img src="${imagenComercio}" class="comercio-avatar" alt="${emp.nombre}">
                        <div style="flex:1;">
                            <h4 style="margin:0 0 4px 0; color:white; font-size:16px; font-weight:900;">${emp.nombre}</h4>
                            <p style="margin:0; font-size:12px; color:var(--text-muted);">📍 ${emp.direccion || 'Montevideo'} • ⭐ 4.9</p>
                            <span style="font-size:10px; color:var(--accent); font-weight:800; background:rgba(255,87,34,0.12); padding:3px 8px; border-radius:6px; display:inline-block; margin-top:6px; border: 1px solid rgba(255,87,34,0.3);">${etiquetaGiro}</span>
                        </div>
                        <span style="color:var(--text-muted); font-size:22px; font-weight:bold;">›</span>
                    </div>
                `;
            }).join('') || '<p style="text-align:center; color:var(--text-muted); padding:20px;">No hay comercios disponibles.</p>';

            container.innerHTML = `
                <div class="search-container">
                    <span>🔍</span>
                    <input type="text" placeholder="¿Qué estás buscando hoy?">
                </div>

                <div class="categorias-scroll">
                    <div class="cat-card" onclick="mostrarHome()">
                        <div style="font-size:24px; margin-bottom:6px;">🍔</div>
                        <p style="margin:0; font-size:11px; font-weight:800;">Restaurantes</p>
                    </div>
                    <div class="cat-card" onclick="mostrarHome()">
                        <div style="font-size:24px; margin-bottom:6px;">🛍️</div>
                        <p style="margin:0; font-size:11px; font-weight:800;">Tiendas</p>
                    </div>
                    <div class="cat-card" onclick="mostrarZonaOutlet()" style="border-color:#D946EF; background:rgba(217,70,239,0.08);">
                        <div style="font-size:24px; margin-bottom:6px;">⚡</div>
                        <p style="margin:0; font-size:11px; font-weight:900; color:#E879F9;">Outlet</p>
                    </div>
                    <div class="cat-card" onclick="mostrarHome()">
                        <div style="font-size:24px; margin-bottom:6px;">💊</div>
                        <p style="margin:0; font-size:11px; font-weight:800;">Farmacia</p>
                    </div>
                </div>

                <div class="outlet-super-banner" onclick="mostrarZonaOutlet()">
                    <div>
                        <div style="font-size:11px; font-weight:900; background:rgba(255,255,255,0.2); padding:3px 8px; border-radius:6px; display:inline-block; margin-bottom:6px; letter-spacing: 0.5px;">OFERTAS FLASH</div>
                        <h3 style="margin:0; font-size:19px; font-weight:900; letter-spacing: -0.5px;">ZONA OUTLET DESTACADO</h3>
                        <p style="margin:4px 0 0 0; font-size:12px; opacity:0.9; font-weight:600;">Descuentos insuperables por tiempo limitado.</p>
                    </div>
                    <span style="font-size:28px; font-weight:900;">⚡</span>
                </div>

                <div class="section-title">Comercios Aliados 🏪</div>
                ${htmlComercios}
            `;
        }

        function verCatalogoComercio(rut) {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = base.find(e => e.rut === rut);
            if (!emp) return;

            const container = document.getElementById('main-content');
            let prods = (emp.productos || []).map((p) => `
                <div class="comercio-card">
                    <img src="${p.imagen || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=200&q=80'}" class="comercio-avatar" alt="${p.nombre}">
                    <div style="flex:1;">
                        <h4 style="margin:0 0 4px 0; color:white; font-size:15px; font-weight:900;">${p.nombre}</h4>
                        <p style="margin:0; font-size:15px; font-weight:900; color:var(--success);">$${p.precio}</p>
                    </div>
                    <button type="button" onclick="iniciarFlujoPago('${emp.rut}', ${p.id})" style="width:auto; padding:10px 16px; font-size:13px;">Pedir</button>
                </div>
            `).join('') || '<p style="text-align:center; color:var::text-muted;">Sin productos cargados.</p>';

            container.innerHTML = `
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
                    <button type="button" onclick="mostrarHome()" style="width:auto; padding:8px 14px; font-size:12px; background:#374151; box-shadow:none;">← Volver</button>
                    <h3 style="color:white; margin:0; font-size:18px; font-weight:900;">${emp.nombre}</h3>
                </div>
                <div style="background:#1F2937; padding:14px; border-radius:var(--radius-md); margin-bottom:20px; font-size:13px; color:var(--text-muted); border: 1.5px solid var(--card-border);">
                    📍 <b>${emp.direccion}</b> | 📞 ${emp.telefono}
                </div>
                <h4 style="color:white; margin-bottom:12px; font-size:16px; font-weight:900;">Catálogo</h4>
                ${prods}
            `;
        }

        function iniciarFlujoPago(rut, productoId) {
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa'));
            let direccionUsuario = sesion.direccion || '';
            let permiteEfectivo = esZonaSeguraEfectivo(direccionUsuario);

            let opcionesPagoHTML = `
                <div style="background:var(--card-bg); padding:20px; border-radius:var(--radius-lg); border:1.5px solid var(--card-border);">
                    <h4 style="color:white; margin-top:0; font-size:18px; font-weight:900;">💳 Método de Pago</h4>
                    <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px;">Entrega en: <b>${direccionUsuario}</b></p>
                    
                    <button type="button" onclick="crearPedidoLocalConPago('${rut}', ${productoId}, 'mercadopago')" style="background:#0284c7; margin-bottom:12px; font-weight:800;">
                        💙 Pagar con Mercado Pago (Online)
                    </button>
            `;

            if (permiteEfectivo) {
                opcionesPagoHTML += `
                    <button type="button" onclick="crearPedidoLocalConPago('${rut}', ${productoId}, 'efectivo')" style="background:var(--success); font-weight:800;">
                        💵 Pagar en Efectivo (Zona Segura)
                    </button>
                `;
            } else {
                opcionesPagoHTML += `
                    <div style="background:#451a03; color:#fde68a; padding:14px; border-radius:var(--radius-md); font-size:13px; text-align:center; border: 1.5px solid #78350f; font-weight:700; margin-bottom: 12px;">
                        ⚠️ Efectivo no disponible para esta zona. Usá Mercado Pago.
                    </div>
                `;
            }

            opcionesPagoHTML += `
                <button type="button" onclick="verCatalogoComercio('${rut}')" style="background:#374151; margin-top:6px; box-shadow:none;">Cancelar</button>
                </div>
            `;

            document.getElementById('main-content').innerHTML = opcionesPagoHTML;
        }

        function crearPedidoLocalConPago(rut, productoId, metodoPago) {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = base.find(e => e.rut === rut);
            if (!emp) return;

            let p = emp.productos.find(prod => prod.id === productoId);
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa'));

            let nuevoPedido = {
                id: Date.now(),
                cliente: sesion.nombre,
                telefonoCliente: sesion.telefono,
                direccion: sesion.direccion,
                formaPago: metodoPago,
                total: p.precio,
                estado: 'Recibido',
                items: [{ nombre: p.nombre, precio: p.precio, cantidad: 1 }],
                codigoVerificacion: Math.floor(1000 + Math.random() * 9000).toString(),
                tiempoInicioEstado: Date.now()
            };

            if (!emp.pedidos) emp.pedidos = [];
            emp.pedidos.push(nuevoPedido);
            
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            window.dispatchEvent(new Event('storage'));

            alert(`✅ ¡Pedido confirmado!\n🔑 PIN de seguridad: [ ${nuevoPedido.codigoVerificacion} ]`);
            mostrarPedidosActivos();
        }

        function mostrarZonaOutlet() {
            actualizarMenuActivo(1);
            const container = document.getElementById('main-content');
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let ofertas = [];

            base.forEach(emp => {
                (emp.productos || []).forEach(p => {
                    if (p.enOutlet) ofertas.push({ ...p, empresaNombre: emp.nombre, rutEmpresa: emp.rut });
                });
            });

            let html = ofertas.map(o => `
                <div class="comercio-card" style="border-left: 5px solid #D946EF;">
                    <img src="${o.imagen || 'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=200&q=80'}" class="comercio-avatar" alt="${o.nombre}">
                    <div style="flex:1;">
                        <span style="font-size:10px; color:#E879F9; font-weight:900; background:rgba(217,70,239,0.15); padding:3px 8px; border-radius:6px; border:1px solid rgba(217,70,239,0.3);">${o.empresaNombre}</span>
                        <h4 style="margin:6px 0 4px 0; color:white; font-size:15px; font-weight:900;">${o.nombre}</h4>
                        <p style="margin:0; font-size:15px; font-weight:900; color:var(--success);">$${o.precio} <span style="background:#D946EF; color:#fff; padding:2px 6px; border-radius:6px; font-size:10px; font-weight:800;">-${o.descuento || 25}%</span></p>
                    </div>
                    <button type="button" onclick="iniciarFlujoPago('${o.rutEmpresa}', ${o.id})" style="width:auto; padding:10px 14px; font-size:12px; background:var(--outlet-gradient);">Comprar</button>
                </div>
            `).join('') || '<p style="text-align:center; color:var(--text-muted); margin-top:40px;">No hay ofertas flash activas en la Zona Outlet.</p>';

            container.innerHTML = `
                <div style="background:var(--outlet-gradient); color:white; padding:22px; border-radius:var(--radius-lg); margin-bottom:22px; box-shadow:var(--shadow-outlet);">
                    <h3 style="margin:0 0 6px 0; font-size:20px; font-weight:900;">⚡ ZONA OUTLET EXCLUSIVA</h3>
                    <p style="margin:0; font-size:13px; opacity:0.95; font-weight:600;">Liquidaciones con stock limitado en Montevideo.</p>
                </div>
                ${html}
            `;
        }

        function mostrarFormularioCadeteria() {
            actualizarMenuActivo(2);
            document.getElementById('main-content').innerHTML = `
                <h3 style="color:white; margin-top:0; font-size:20px; font-weight:900;">🛵 Cadetería Express</h3>
                <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px;">Envíos puerta a puerta rápidos.</p>

                <label>Vehículo:</label>
                <select id="cadVehiculo">
                    <option value="moto">Moto ($220)</option>
                    <option value="camioneta">Camioneta ($480)</option>
                </select>
                <label>Origen (Retiro):</label>
                <input type="text" id="cadPuntoA" placeholder="Dirección de origen">
                <label>Destino (Entrega):</label>
                <input type="text" id="cadPuntoB" placeholder="Dirección de destino">
                <button type="button" onclick="confirmarCadeteriaExpress()" style="background:var(--success); margin-top:10px; font-weight:800;">Solicitar Envío</button>
            `;
        }

        function confirmarCadeteriaExpress() {
            let vehiculo = document.getElementById('cadVehiculo').value;
            let pa = document.getElementById('cadPuntoA').value;
            let pb = document.getElementById('cadPuntoB').value;
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa'));

            if (!pa || !pb) { alert("⚠️ Completá origen y destino."); return; }

            let nuevoPedido = {
                id: Date.now(),
                cliente: sesion.nombre,
                telefonoCliente: sesion.telefono,
                direccion: pb,
                formaPago: 'mercadopago',
                total: vehiculo === 'moto' ? 220 : 480,
                estado: 'Recibido',
                descripcion: `Cadetería (${vehiculo})`,
                items: [{ nombre: `Envío (${vehiculo})`, precio: vehiculo === 'moto' ? 220 : 480, cantidad: 1 }],
                codigoVerificacion: Math.floor(1000 + Math.random() * 9000).toString(),
                tiempoInicioEstado: Date.now()
            };

            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            if (base.length === 0) { alert("⚠️ Configurar central primero."); return; }
            let central = base[0];
            if (!central.pedidos) central.pedidos = [];
            central.pedidos.push(nuevoPedido);
            
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            window.dispatchEvent(new Event('storage'));

            alert(`✅ ¡Cadetería solicitada!\n🔑 PIN: [ ${nuevoPedido.codigoVerificacion} ]`);
            mostrarPedidosActivos();
        }

        function mostrarPedidosActivos() {
            actualizarMenuActivo(3);
            renderizarListaPedidos();
        }

        function renderizarListaPedidos() {
            const container = document.getElementById('main-content');
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let misPedidos = [];
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa'));

            base.forEach(emp => {
                (emp.pedidos || []).forEach(p => {
                    if (p.cliente === sesion.nombre) misPedidos.push({ ...p, empresaNombre: emp.nombre });
                });
            });

            misPedidos.sort((a, b) => b.id - a.id);

            let html = misPedidos.map(p => {
                let estadoActual = p.estado || 'Recibido';
                let claseEstado = 'estado-recibido';
                if (estadoActual === 'En Preparación') claseEstado = 'estado-proceso';
                if (estadoActual.includes('Listo')) claseEstado = 'estado-pronto';
                if (estadoActual === 'En Camino') claseEstado = 'estado-camino';

                let itemsTexto = (p.items || []).map(i => `${i.cantidad}x ${i.nombre}`).join(', ');

                return `
                    <div class="comercio-card" style="display:block; border-left: 5px solid var(--accent); margin-bottom: 14px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items:center;">
                            <strong style="color:white; font-size:14px; font-weight:900;">Pedido #${p.id.toString().slice(-4)}</strong>
                            <span class="badge-estado ${claseEstado}">${estadoActual}</span>
                        </div>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">🏪 Local: <b>${p.empresaNombre}</b></p>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">📦 ${itemsTexto}</p>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">💳 Pago: <b>${(p.formaPago || 'efectivo').toUpperCase()}</b></p>
                        <div style="background:#111827; padding:10px; border-radius:var(--radius-md); text-align:center; margin-top:12px; border: 1.5px solid var(--card-border);">
                            <span style="font-size:12px; color:var(--text-muted);">🔑 PIN de seguridad: <b style="color:#E879F9; font-size:15px;">${p.codigoVerificacion}</b></span>
                        </div>
                    </div>
                `;
            }).join('') || '<p style="text-align:center; color:var(--text-muted); margin-top:40px;">No tenés pedidos activos.</p>';

            container.innerHTML = `
                <h3 style="color:white; margin-top:0; font-size:20px; font-weight:900;">📦 Mis Pedidos</h3>
                <div id="contenedor-cards-pedidos">${html}</div>
            `;
        }

        function actualizarMenuActivo(index) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach((btn, idx) => {
                if (idx === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }
    </script>
</body>
</html>
